
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ellie Loew-Mendelson</title>

  <style>
    :root {
      --cream: #FFF9EF;
      --green: #669B4B;
      --yellow: #ECA602;
      --lavender: #C2A7D3;
      --pink: #F26A8D;
      --red: #BB0523;
      --burgundy: #880D1E;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--burgundy);
      font-family: Georgia, serif;
    }

    .canvas {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
    }

    .site-title {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      width: 280px;
      text-align: center;
      pointer-events: none;
    }

    .site-title h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.5rem);
      line-height: 1.05;
    }

    .site-title p {
      font-family: sans-serif;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .sticker {
      position: absolute;
      display: block;
      width: var(--size, 150px);
      left: var(--x);
      top: var(--y);
      transform: rotate(var(--rotation, 0deg));
      text-align: center;
      text-decoration: none;
      color: var(--burgundy);
      transition: transform 180ms ease;
      z-index: 2;
    }

    .sticker img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .sticker span {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 9px;
      background: var(--cream);
      border-radius: 8px;
      font: 600 0.9rem sans-serif;
    }

    .sticker:hover,
    .sticker:focus-visible {
      transform: rotate(0deg) scale(1.09);
      z-index: 5;
    }

    .sticker:focus-visible {
      outline: 3px solid var(--green);
      outline-offset: 6px;
      border-radius: 8px;
    }

    /* Desktop positions: adjust x, y, size, and rotation */
    .publications {
      --x: 8%; --y: 10%; --size: 145px; --rotation: -9deg;
    }

    .projects {
      --x: 39%; --y: 7%; --size: 165px; --rotation: 7deg;
    }

    .outreach {
      --x: 75%; --y: 13%; --size: 135px; --rotation: 10deg;
    }

    .cv {
      --x: 13%; --y: 57%; --size: 125px; --rotation: 8deg;
    }

    .art {
      --x: 72%; --y: 55%; --size: 175px; --rotation: -7deg;
    }

    .contact {
      --x: 43%; --y: 72%; --size: 120px; --rotation: 5deg;
    }

    @media (max-width: 650px) {
      .canvas {
        min-height: 100vh;
        padding: 28px 18px 36px;
        overflow: visible;
      }

      .site-title {
        position: relative;
        top: auto;
        left: auto;
        transform: none;
        width: 100%;
        margin: 10px auto 30px;
      }

      .sticker {
        position: relative;
        top: auto;
        left: auto;
        width: 100%;
        max-width: 145px;
        transform: rotate(var(--rotation, 0deg));
        justify-self: center;
      }

      .sticker span {
        font-size: 0.85rem;
      }

      .sticker img {
        max-height: 125px;
      }

      .sticker:hover,
      .sticker:focus-visible {
        transform: scale(1.04);
      }

      .sticker-board {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px 16px;
        align-items: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sticker {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="canvas">

    <div class="site-title">
      <h1>Ellie<br>Loew-Mendelson</h1>
      <p>Botany · Ecology · Art</p>
    </div>

    <nav class="sticker-board" aria-label="Main navigation">

      <a class="sticker publications"
         href="publications.html"
         aria-label="Publications">
        <img src="icons/publications.png" alt="">
        <span>Publications</span>
      </a>

      <a class="sticker projects"
         href="projects.html"
         aria-label="Research projects">
        <img src="icons/projects.png" alt="">
        <span>Projects</span>
      </a>

      <a class="sticker outreach"
         href="outreach.html"
         aria-label="Science outreach">
        <img src="icons/outreach.png" alt="">
        <span>Outreach</span>
      </a>

      <a class="sticker cv"
         href="files/cv.pdf"
         aria-label="Curriculum vitae">
        <img src="icons/cv.png" alt="">
        <span>CV</span>
      </a>

      <a class="sticker art"
         href="art-microscopy.html"
         aria-label="Art and microscopy">
        <img src="icons/art-microscopy.png" alt="">
        <span>Art &amp; Microscopy</span>
      </a>

      <a class="sticker contact"
         href="mailto:your-email@example.com"
         aria-label="Contact Ellie">
        <img src="icons/contact.png" alt="">
        <span>Contact</span>
      </a>

    </nav>
  </main>
</body>
</html>
